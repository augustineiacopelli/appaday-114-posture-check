<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="apple-touch-icon" href="https://augustineiacopelli.github.io/appaday/icons/114.png">
<meta name="apple-mobile-web-app-title" content="Posture">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="https://augustineiacopelli.github.io/appaday/manifests/114.webmanifest">
<script src="https://augustineiacopelli.github.io/appaday/save.js" defer></script>
<title>Posture Check | AppADay 114</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #10151b;
    --panel: #1a222b;
    --panel-2: #202a35;
    --border: #2c3947;
    --text: #eef2f6;
    --text-dim: #93a2b3;
    --accent: #5fd0a8;
    --accent-dim: #2e6650;
    --warn: #f0a860;
    --danger: #e8697a;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
  }

  h1, h2, h3 {
    font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
    margin: 0;
  }

  a { color: inherit; }

  header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .app-title {
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .backlink {
    font-size: 0.78rem;
    color: var(--text-dim);
    text-decoration: none;
    width: fit-content;
  }

  .backlink:hover { color: var(--accent); }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 18px 16px 24px;
    max-width: 560px;
    width: 100%;
    margin: 0 auto;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
  }

  .status-panel {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .status-block { display: flex; flex-direction: column; gap: 2px; }

  .status-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
  }

  .status-value {
    font-size: 1.6rem;
    font-weight: 700;
    font-family: 'Space Grotesk', sans-serif;
  }

  .status-value.streak { color: var(--accent); }

  .run-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text-dim);
  }

  .run-pill.active { color: var(--accent); border-color: var(--accent-dim); }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
  }

  .run-pill.active .dot { background: var(--accent); box-shadow: 0 0 0 3px rgba(95,208,168,0.18); }

  .section-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  .interval-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .interval-btn {
    min-height: 44px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }

  .interval-btn.selected {
    border-color: var(--accent);
    background: rgba(95,208,168,0.14);
    color: var(--accent);
  }

  .custom-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .custom-row input {
    flex: 1;
    min-height: 44px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    padding: 0 12px;
    font-size: 0.95rem;
  }

  .custom-row button {
    min-height: 44px;
    padding: 0 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text-dim);
    font-weight: 600;
    cursor: pointer;
  }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 2px;
    border-top: 1px solid var(--border);
  }

  .toggle-row:first-of-type { border-top: none; }

  .toggle-label {
    font-size: 0.92rem;
    font-weight: 500;
  }

  .switch {
    position: relative;
    width: 46px;
    height: 26px;
    flex-shrink: 0;
  }

  .switch input {
    opacity: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    cursor: pointer;
    position: absolute;
    z-index: 2;
  }

  .switch .track {
    position: absolute;
    inset: 0;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    transition: background 0.15s ease;
  }

  .switch .knob {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .switch input:checked + .track { background: rgba(95,208,168,0.18); border-color: var(--accent-dim); }
  .switch input:checked + .track + .knob { transform: translateX(20px); background: var(--accent); }

  .main-action {
    width: 100%;
    min-height: 52px;
    border-radius: 12px;
    border: none;
    font-size: 1rem;
    font-weight: 700;
    font-family: 'Space Grotesk', sans-serif;
    cursor: pointer;
    background: var(--accent);
    color: #0b1210;
  }

  .main-action.stop {
    background: var(--panel-2);
    color: var(--danger);
    border: 1px solid var(--danger);
  }

  .reminder-card {
    display: none;
    border: 1px solid var(--accent-dim);
    background: linear-gradient(180deg, rgba(95,208,168,0.10), rgba(95,208,168,0.02));
  }

  .reminder-card.show { display: block; }

  .reminder-eyebrow {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin-bottom: 8px;
    font-weight: 700;
  }

  .reminder-tip {
    font-size: 1.05rem;
    line-height: 1.5;
    margin-bottom: 16px;
  }

  .reminder-actions {
    display: flex;
    gap: 10px;
  }

  .reminder-actions button {
    flex: 1;
    min-height: 46px;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.92rem;
  }

  .ack-btn {
    border: none;
    background: var(--accent);
    color: #0b1210;
  }

  .snooze-btn {
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
  }

  .hint {
    font-size: 0.78rem;
    color: var(--text-dim);
    line-height: 1.5;
  }

  footer {
    padding: 16px 20px 22px;
    border-top: 1px solid var(--border);
    text-align: center;
  }

  footer .backlink { margin: 0 auto; }

  @media (max-width: 420px) {
    .interval-grid { grid-template-columns: repeat(3, 1fr); }
    .status-panel { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<header>
  <div class="app-title">Posture Check</div>
  <a class="backlink" href="https://augustineiacopelli.github.io/appaday/">&larr; AppADay Portfolio</a>
</header>

<main>

  <section class="panel status-panel">
    <div class="status-block">
      <span class="status-label">Streak</span>
      <span class="status-value streak" id="streakValue">0</span>
    </div>
    <div class="status-block">
      <span class="status-label">Total Checks</span>
      <span class="status-value" id="totalValue">0</span>
    </div>
    <span class="run-pill" id="runPill"><span class="dot"></span><span id="runPillText">Stopped</span></span>
  </section>

  <section class="panel">
    <div class="section-label">Reminder Interval</div>
    <div class="interval-grid" id="intervalGrid">
      <button class="interval-btn" data-min="20">20 min</button>
      <button class="interval-btn" data-min="30">30 min</button>
      <button class="interval-btn" data-min="45">45 min</button>
      <button class="interval-btn" data-min="60">60 min</button>
      <button class="interval-btn" data-min="90">90 min</button>
      <button class="interval-btn" data-min="0" id="customPickBtn">Custom</button>
    </div>
    <div class="custom-row">
      <input type="number" id="customMinutes" min="1" max="240" placeholder="Custom minutes" inputmode="numeric">
      <button id="setCustomBtn">Set</button>
    </div>

    <div class="toggle-row">
      <span class="toggle-label">Sound</span>
      <label class="switch">
        <input type="checkbox" id="soundToggle">
        <span class="track"></span>
        <span class="knob"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label">Vibration</span>
      <label class="switch">
        <input type="checkbox" id="vibrationToggle">
        <span class="track"></span>
        <span class="knob"></span>
      </label>
    </div>
  </section>

  <button class="main-action" id="mainActionBtn">Start Reminders</button>
  <p class="hint" id="permHint"></p>

  <section class="panel reminder-card" id="reminderCard">
    <div class="reminder-eyebrow">Posture Check</div>
    <div class="reminder-tip" id="reminderTipText">Sit up straight.</div>
    <div class="reminder-actions">
      <button class="ack-btn" id="ackBtn">Done</button>
      <button class="snooze-btn" id="snoozeBtn">Snooze 5m</button>
    </div>
  </section>

</main>

<footer>
  <a class="backlink" href="https://augustineiacopelli.github.io/appaday/">&larr; AppADay Portfolio</a>
</footer>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'postureCheck_state';
  var SNOOZE_MS = 5 * 60 * 1000;

  var TIPS = [
    'Sit up straight. Roll your shoulders back and down.',
    'Tuck your chin slightly. Line your ears up over your shoulders.',
    'Stand up and stretch your arms overhead for ten seconds.',
    'Relax your shoulders away from your ears. Take a deep breath.',
    'Push your chest open and squeeze your shoulder blades together.',
    'Stand, plant your feet, and gently twist your torso side to side.',
    'Drop your chin to your chest and slowly roll your neck in a circle.',
    'Plant your feet flat on the floor and lengthen your spine tall.',
    'Reach one arm across your chest and hold, then switch sides.',
    'Lean back, clasp your hands, and stretch your arms overhead.'
  ];

  var defaultState = {
    intervalMinutes: 30,
    soundOn: true,
    vibrationOn: true,
    lastAckDate: null,
    streakCount: 0,
    totalChecks: 0,
    nextFireTime: null
  };

  function getState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return Object.assign({}, defaultState);
      var parsed = JSON.parse(raw);
      return Object.assign({}, defaultState, parsed);
    } catch (e) {
      return Object.assign({}, defaultState);
    }
  }

  function saveState(state) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      /* storage unavailable, continue silently */
    }
  }

  var state = getState();
  var intervalHandle = null;
  var lastTipIndex = -1;

  var streakValue = document.getElementById('streakValue');
  var totalValue = document.getElementById('totalValue');
  var runPill = document.getElementById('runPill');
  var runPillText = document.getElementById('runPillText');
  var intervalGrid = document.getElementById('intervalGrid');
  var customMinutes = document.getElementById('customMinutes');
  var setCustomBtn = document.getElementById('setCustomBtn');
  var soundToggle = document.getElementById('soundToggle');
  var vibrationToggle = document.getElementById('vibrationToggle');
  var mainActionBtn = document.getElementById('mainActionBtn');
  var permHint = document.getElementById('permHint');
  var reminderCard = document.getElementById('reminderCard');
  var reminderTipText = document.getElementById('reminderTipText');
  var ackBtn = document.getElementById('ackBtn');
  var snoozeBtn = document.getElementById('snoozeBtn');

  function pickTip() {
    if (TIPS.length <= 1) return TIPS[0];
    var idx;
    do {
      idx = Math.floor(Math.random() * TIPS.length);
    } while (idx === lastTipIndex);
    lastTipIndex = idx;
    return TIPS[idx];
  }

  function todayStr(d) {
    var date = d ? new Date(d) : new Date();
    var y = date.getFullYear();
    var m = String(date.getMonth() + 1).padStart(2, '0');
    var day = String(date.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  function daysBetween(aStr, bStr) {
    var a = new Date(aStr + 'T00:00:00');
    var b = new Date(bStr + 'T00:00:00');
    return Math.round((b - a) / 86400000);
  }

  function renderStatus() {
    streakValue.textContent = state.streakCount;
    totalValue.textContent = state.totalChecks;
  }

  function renderIntervalButtons() {
    var buttons = intervalGrid.querySelectorAll('.interval-btn');
    var matched = false;
    buttons.forEach(function (btn) {
      var min = parseInt(btn.dataset.min, 10);
      var isCustomBtn = btn.id === 'customPickBtn';
      if (!isCustomBtn && min === state.intervalMinutes) {
        btn.classList.add('selected');
        matched = true;
      } else if (!isCustomBtn) {
        btn.classList.remove('selected');
      }
    });
    var customBtn = document.getElementById('customPickBtn');
    if (!matched) {
      customBtn.classList.add('selected');
      customBtn.textContent = state.intervalMinutes + ' min';
    } else {
      customBtn.classList.remove('selected');
      customBtn.textContent = 'Custom';
    }
  }

  function renderToggles() {
    soundToggle.checked = !!state.soundOn;
    vibrationToggle.checked = !!state.vibrationOn;
  }

  function renderRunState() {
    var running = intervalHandle !== null;
    if (running) {
      runPill.classList.add('active');
      runPillText.textContent = 'Running';
      mainActionBtn.textContent = 'Stop Reminders';
      mainActionBtn.classList.add('stop');
    } else {
      runPill.classList.remove('active');
      runPillText.textContent = 'Stopped';
      mainActionBtn.textContent = 'Start Reminders';
      mainActionBtn.classList.remove('stop');
    }
  }

  function renderAll() {
    renderStatus();
    renderIntervalButtons();
    renderToggles();
    renderRunState();
  }

  function playTone() {
    try {
      var AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      var ctx = new AudioCtx();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 660;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.55);
      osc.onended = function () {
        ctx.close();
      };
    } catch (e) {
      /* audio unavailable, continue silently */
    }
  }

  function fire() {
    var tip = pickTip();
    reminderTipText.textContent = tip;
    reminderCard.classList.add('show');

    if ('Notification' in window && Notification.permission === 'granted' && document.hidden) {
      try {
        new Notification('Posture Check', {
          body: tip
        });
      } catch (e) {
        /* notification unavailable, continue silently */
      }
    }

    if (state.soundOn) playTone();

    if (state.vibrationOn && 'vibrate' in navigator) {
      try {
        navigator.vibrate([120, 60, 120]);
      } catch (e) {
        /* vibration unavailable, continue silently */
      }
    }
  }

  function scheduleNext() {
    state.nextFireTime = Date.now() + state.intervalMinutes * 60000;
    saveState(state);
  }

  function tick() {
    fire();
    scheduleNext();
  }

  function startReminders() {
    if (intervalHandle !== null) return;

    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission().then(function (perm) {
        updatePermHint(perm);
      });
    } else if ('Notification' in window) {
      updatePermHint(Notification.permission);
    } else {
      permHint.textContent = 'This browser does not support system notifications. In-app alerts will still work.';
    }

    scheduleNext();
    intervalHandle = setInterval(tick, state.intervalMinutes * 60000);
    renderRunState();
  }

  function stopReminders() {
    if (intervalHandle !== null) {
      clearInterval(intervalHandle);
      intervalHandle = null;
    }
    state.nextFireTime = null;
    saveState(state);
    renderRunState();
  }

  function updatePermHint(perm) {
    if (perm === 'granted') {
      permHint.textContent = 'System notifications are on. You will get an alert even if this tab is in the background.';
    } else if (perm === 'denied') {
      permHint.textContent = 'Notifications are blocked. Reminders will still show inside this tab while it is open.';
    } else {
      permHint.textContent = 'Reminders will show inside this tab. Allow notifications to also get alerts in the background.';
    }
  }

  function acknowledge() {
    reminderCard.classList.remove('show');
    state.totalChecks += 1;

    var today = todayStr();
    if (state.lastAckDate === today) {
      /* already acked today, streak unchanged */
    } else if (state.lastAckDate) {
      var gap = daysBetween(state.lastAckDate, today);
      if (gap === 1) {
        state.streakCount += 1;
      } else if (gap > 1) {
        state.streakCount = 1;
      } else {
        state.streakCount = state.streakCount || 1;
      }
    } else {
      state.streakCount = 1;
    }

    state.lastAckDate = today;
    saveState(state);
    renderStatus();
  }

  function snooze() {
    reminderCard.classList.remove('show');
    state.nextFireTime = Date.now() + SNOOZE_MS;
    saveState(state);

    if (intervalHandle !== null) {
      clearInterval(intervalHandle);
      intervalHandle = setInterval(tick, state.intervalMinutes * 60000);
    }
  }

  function setInterval_(minutes) {
    minutes = Math.max(1, Math.min(240, Math.round(minutes)));
    state.intervalMinutes = minutes;
    saveState(state);
    renderIntervalButtons();

    if (intervalHandle !== null) {
      clearInterval(intervalHandle);
      scheduleNext();
      intervalHandle = setInterval(tick, state.intervalMinutes * 60000);
    }
  }

  intervalGrid.addEventListener('click', function (e) {
    var btn = e.target.closest('.interval-btn');
    if (!btn) return;
    if (btn.id === 'customPickBtn') {
      customMinutes.focus();
      return;
    }
    var min = parseInt(btn.dataset.min, 10);
    if (!isNaN(min) && min > 0) {
      setInterval_(min);
    }
  });

  setCustomBtn.addEventListener('click', function () {
    var val = parseInt(customMinutes.value, 10);
    if (!isNaN(val) && val > 0) {
      setInterval_(val);
      customMinutes.value = '';
    }
  });

  soundToggle.addEventListener('change', function () {
    state.soundOn = soundToggle.checked;
    saveState(state);
  });

  vibrationToggle.addEventListener('change', function () {
    state.vibrationOn = vibrationToggle.checked;
    saveState(state);
  });

  mainActionBtn.addEventListener('click', function () {
    if (intervalHandle !== null) {
      stopReminders();
    } else {
      startReminders();
    }
  });

  ackBtn.addEventListener('click', acknowledge);
  snoozeBtn.addEventListener('click', snooze);

  function catchUpCheck() {
    if (state.nextFireTime && Date.now() >= state.nextFireTime) {
      fire();
    }
  }

  renderAll();

  if ('Notification' in window) {
    updatePermHint(Notification.permission);
  } else {
    permHint.textContent = 'This browser does not support system notifications. In-app alerts will still work.';
  }

  if (state.nextFireTime) {
    catchUpCheck();
  }

})();
</script>

</body>
</html>
